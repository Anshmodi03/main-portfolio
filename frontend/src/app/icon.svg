<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#080808"/>
  <!-- AM text — bold, white, tight tracking, left of center to give space for dot -->
